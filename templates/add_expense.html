{% extends "base.html" %}

{% block content %}

<div class="row justify-content-center">

<div class="col-md-5">

<div class="card p-4">

<h4 class="mb-4 text-center">Edit Expense</h4>

<form method="POST">

{% csrf_token %}

<div class="mb-3">
<label>Category</label>
{{ form.category }}
</div>

<div class="mb-3">
<label>Title</label>
{{ form.title }}
</div>

<div class="mb-3">
<label>Amount</label>
{{ form.amount }}
</div>

<div class="mb-3">
<label>Date</label>
{{ form.date }}
</div>

<div class="mb-3">
<label>Description</label>
{{ form.description }}
</div>

<button class="btn btn-dark w-100">
Update Expense
</button>

</form>

</div>

</div>

</div>

{% endblock %}
