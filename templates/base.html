<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<title>SpendWise</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
background-color:#ffffff;
color:#000000;
font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
}

.navbar{
border-bottom:1px solid #e5e5e5;
}

.card{
border:1px solid #e5e5e5;
border-radius:12px;
}

.btn-primary{
background:black;
border:none;
}

.btn-primary:hover{
background:#333;
}

.table{
background:white;
}

input, select, textarea{
border-radius:8px !important;
border:1px solid #dcdcdc !important;
}

input:focus, select:focus, textarea:focus{
box-shadow:none !important;
border-color:black !important;
}

.sidebar a{
display:block;
padding:10px 0;
font-weight:500;
text-decoration:none;
color:black;
}

.sidebar a:hover{
color:#555;
}

.sidebar{
min-height:100vh;
}

</style>

</head>

<body>

<div class="container-fluid">

<div class="row vh-100">

<div class="col-md-2 bg-white border-end p-4 sidebar">

<h5 class="fw-bold mb-4">SpendWise</h5>

<a href="/dashboard/"><i class="fa fa-chart-pie me-2"></i>Dashboard</a>
<a href="/add/"><i class="fa fa-plus me-2"></i>Add Expense</a>
<a href="/login/"><i class="fa fa-sign-out-alt me-2"></i>Logout</a>

</div>


<div class="col-md-10 p-4" style="max-width:1200px">

{% block content %}

{% endblock %}

</div>

</div>

</div>

</body>

</html>
